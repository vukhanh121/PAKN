<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b315f">
  <meta name="description" content="Hệ thống theo dõi, giám sát và công khai kết quả giải quyết ý kiến, kiến nghị cử tri - HĐND phường Rạch Giá.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <title>Hệ thống theo dõi kiến nghị cử tri - HĐND phường Rạch Giá</title>
  <style>
    :root{
      --bg:#f5f7fb; --card:#ffffff; --muted:#63758b; --brand:#1259c3; --text:#0b315f;
      --radius:14px; --glass: rgba(255,255,255,0.6);
      --header-height:64px;
    }
    [data-theme="dark"]{
      --bg:#071026; --card:rgba(10,16,30,0.6); --muted:#93a3bf; --text:#e6f0ff; --glass: rgba(255,255,255,0.03);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,var(--bg),#ffffff);color:var(--text);-webkit-font-smoothing:antialiased}

    /* Header overlay */
    header{position:fixed;left:0;right:0;top:env(safe-area-inset-top);display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(255,255,255,0.6);backdrop-filter:blur(6px);z-index:60;height:var(--header-height)}
    [data-theme="dark"] header{background:rgba(8,12,20,0.45)}
    .brand{display:flex;align-items:center;gap:10px}
    .logo{width:44px;height:44px;background:linear-gradient(135deg,var(--brand),#3aa0ff);border-radius:10px;display:grid;place-items:center;color:white;font-weight:700;box-shadow:0 6px 18px rgba(18,89,195,0.18)}
    .title{font-size:15px;font-weight:700}
    .subtitle{font-size:12px;color:var(--muted);margin-top:2px}
    .actions{margin-left:auto;display:flex;gap:8px;align-items:center}
    .btn{appearance:none;border:0;background:transparent;color:var(--text);padding:8px 12px;border-radius:10px;font-weight:600;cursor:pointer}
    .btn.ghost{background:transparent;border:1px solid rgba(11,49,95,0.06)}
    .btn.primary{background:var(--brand);color:#fff;box-shadow:0 6px 18px rgba(18,89,195,0.12)}

    /* Full-bleed iframe behind header on small screens; truly full on desktop */
    iframe{position:fixed;left:0;right:0;bottom:0;top:var(--header-height);width:100%;border:0;background:#fff;z-index:0;height:calc(100dvh - var(--header-height));}

    /* If 100dvh isn't supported, JS will set height fallback on mobile. */

    /* Loading overlay centered */
    .loading-overlay{position:fixed;left:0;right:0;top:var(--header-height);bottom:0;display:grid;place-items:center;background:transparent;z-index:50;pointer-events:none}
    .loader-card{pointer-events:auto;background:var(--glass);border-radius:12px;padding:14px 18px;text-align:center;box-shadow:0 6px 18px rgba(2,8,23,0.06)}
    .dots{display:inline-flex;gap:6px;margin-top:8px}
    .dot{width:9px;height:9px;background:var(--brand);border-radius:999px;opacity:0;animation:dots 1s infinite}
    .dot:nth-child(2){animation-delay:.15s}
    .dot:nth-child(3){animation-delay:.3s}
    @keyframes dots{0%{transform:translateY(4px);opacity:0}40%{transform:translateY(0);opacity:1}80%{transform:translateY(-4px);opacity:0.6}100%{opacity:0}}

    /* Responsive header sizing for small screens */
    @media (max-width:720px){
      header{padding:10px 12px}
      .title{font-size:14px}
      .subtitle{display:none}
    }

    /* On desktop, hide header and make iframe truly full-screen */
    @media (min-width:1024px){
      header{display:none}
      iframe{top:0;height:100vh}
      .loading-overlay{top:0}
      noscript{top:0}
    }

    /* Ensure noscript area visible above iframe */
    noscript{position:fixed;left:0;right:0;top:var(--header-height);padding:12px;text-align:center;background:var(--card);z-index:55}
  </style>
</head>
<body>
  <header role="banner">
    <div class="brand">
      <div class="logo" aria-hidden="true">RG</div>
      <div>
        <div class="title">Hệ thống theo dõi — HĐND phường Rạch Giá</div>
        <div class="subtitle">Giám sát & công khai kết quả xử lý ý kiến, kiến nghị</div>
      </div>
    </div>

    <div class="actions" role="toolbar" aria-label="Hành động">
      <button class="btn ghost" id="openDirect">Mở trực tiếp</button>
      <button class="btn" id="reloadFrame" title="Tải lại">Tải lại</button>
      <button class="btn primary" id="toggleTheme" title="Giao diện">Dark</button>
    </div>
  </header>

  <div class="loading-overlay" id="loading" role="status" aria-live="polite">
    <div class="loader-card">
      <div style="font-weight:700">Đang mở hệ thống…</div>
      <div style="font-size:13px;color:var(--muted);margin-top:6px">Hội đồng nhân dân phường Rạch Giá</div>
      <div class="dots" aria-hidden="true">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </div>
  </div>

  <iframe id="appFrame" title="Hệ thống theo dõi, giám sát và công khai kết quả giải quyết ý kiến, kiến nghị cử tri"
    referrerpolicy="strict-origin-when-cross-origin" allow="clipboard-read; clipboard-write"></iframe>

  <noscript>
    JavaScript bị tắt — <a id="openDirectNoJS" href="#" target="_blank" rel="noopener noreferrer">Mở hệ thống trực tiếp</a>
  </noscript>

  <script>
    (function(){
      const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzaV3Ts29UWnCuwLt6HQtAYr5b9jGujH-NVsr0T9JzjVN7YucT7E1RYLC4Ol3at8koISw/exec';
      const frame = document.getElementById('appFrame');
      const loading = document.getElementById('loading');
      const openDirect = document.getElementById('openDirect');
      const openDirectNoJS = document.getElementById('openDirectNoJS');
      const reloadBtn = document.getElementById('reloadFrame');
      const themeBtn = document.getElementById('toggleTheme');

      openDirect.addEventListener('click', ()=> window.open(WEB_APP_URL, '_blank', 'noopener'));
      openDirectNoJS && (openDirectNoJS.href = WEB_APP_URL);

      frame.src = WEB_APP_URL;
      frame.addEventListener('load', ()=> {
        loading.style.display = 'none';
      });

      // On mobile browsers 100dvh support is inconsistent; apply JS fallback for iframe height when header is present
      function updateFrameHeight() {
        const isDesktop = window.innerWidth >= 1024;
        if (isDesktop) {
          frame.style.top = '0';
          frame.style.height = '100vh';
          loading.style.top = '0';
        } else {
          const header = document.querySelector('header');
          const h = header ? Math.ceil(header.getBoundingClientRect().height) : 64;
          frame.style.top = h + 'px';
          // prefer dynamic vh when supported
          if (window.CSS && CSS.supports && CSS.supports('height','100dvh')) {
            frame.style.height = 'calc(100dvh - ' + h + 'px)';
          } else {
            frame.style.height = (window.innerHeight - h) + 'px';
          }
          loading.style.top = h + 'px';
        }
      }

      window.addEventListener('resize', updateFrameHeight);
      window.addEventListener('orientationchange', updateFrameHeight);
      updateFrameHeight();

      reloadBtn.addEventListener('click', ()=> {
        loading.style.display = 'grid';
        try {
          frame.contentWindow.location.reload();
        } catch (e) {
          frame.src = WEB_APP_URL;
        }
      });

      // theme toggle with persistence
      const preferDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const saved = localStorage.getItem('pkg_theme');
      let dark = saved ? saved === 'dark' : preferDark;
      const updateThemeUI = ()=> {
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        themeBtn.textContent = dark ? 'Light' : 'Dark';
      };
      themeBtn.addEventListener('click', ()=> { dark = !dark; localStorage.setItem('pkg_theme', dark ? 'dark' : 'light'); updateThemeUI(); });
      updateThemeUI();

      // fallback button insert after timeout
      setTimeout(()=> {
        if (loading.style.display !== 'none') {
          const btnWrap = document.createElement('div');
          btnWrap.style.marginTop = '10px';
          btnWrap.innerHTML = '<a href="'+WEB_APP_URL+'" target="_blank" rel="noopener noreferrer" class="btn primary">Mở hệ thống trực tiếp</a>';
          loading.querySelector('.loader-card').appendChild(btnWrap);
        }
      }, 4500);

      // optional postMessage readiness support
      window.addEventListener('message', ev=>{
        if (!ev.origin) return;
        if (ev.origin.indexOf('https://script.google.com') !== 0) return;
        if (ev.data && ev.data.appReady) loading.style.display = 'none';
      });
    })();
  </script>
</body>
</html>
