<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b315f">
  <meta name="description" content="Hệ thống theo dõi, giám sát và công khai kết quả giải quyết ý kiến, kiến nghị cử tri - HĐND phường Rạch Giá.">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <title>Hệ thống theo dõi kiến nghị cử tri - HĐND phường Rạch Giá</title>
  <style>
    :root{--bg:#f4f7fb;--brand:#1259c3;--text:#0b315f}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif}
    /* allow page scrolling if needed (avoid hiding content on small screens) */
    body{overflow:auto;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
    .loading{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#eef5ff,#fff);z-index:999;color:var(--text);text-align:center;padding:24px;transition:opacity .25s ease}
    .loading.hide{opacity:0;pointer-events:none;visibility:hidden}
    .spinner{width:44px;height:44px;margin:0 auto 16px;border:4px solid #d9e7f7;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
    .loading strong{display:block;font-size:17px;margin-bottom:6px}
    .loading small{color:#63758b}
    .fallback{display:none;margin-top:18px}
    .fallback.show{display:block}
    .fallback a{display:inline-block;padding:10px 16px;border-radius:9px;background:var(--brand);color:#fff;text-decoration:none;font-weight:600}
    iframe{display:block;width:100%;height:100vh;border:0;background:#fff;min-height:600px}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* small responsive tweaks */
    @media (max-width:420px){
      .loading{padding:18px}
      .loading strong{font-size:15px}
    }
  </style>
</head>
<body>
  <div class="loading" id="loading" role="status" aria-live="polite">
    <div>
      <div class="spinner" aria-hidden="true"></div>
      <strong>Đang mở hệ thống…</strong>
      <small>Hội đồng nhân dân phường Rạch Giá</small>
      <div class="fallback" id="fallback">
        <a id="openDirect" href="#" target="_blank" rel="noopener noreferrer">Mở hệ thống trực tiếp</a>
      </div>
    </div>
  </div>

  <iframe
    id="appFrame"
    title="Hệ thống theo dõi, giám sát và công khai kết quả giải quyết ý kiến, kiến nghị cử tri"
    allow="camera; microphone; clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <noscript>
    <div style="padding:24px;text-align:center;background:#fff;">
      <p><strong>JavaScript bị tắt</strong></p>
      <p>Bấm vào nút dưới đây để mở hệ thống trực tiếp:</p>
      <p><a href="https://script.google.com/macros/s/AKfycbzaV3Ts29UWnCuwLt6HQtAYr5b9jGujH-NVsr0T9JzjVN7YucT7E1RYLC4Ol3at8koISw/exec" target="_blank" rel="noopener noreferrer">Mở hệ thống trực tiếp</a></p>
    </div>
  </noscript>

  <script>
    (function(){
      const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzaV3Ts29UWnCuwLt6HQtAYr5b9jGujH-NVsr0T9JzjVN7YucT7E1RYLC4Ol3at8koISw/exec';
      const frame = document.getElementById('appFrame');
      const loading = document.getElementById('loading');
      const fallback = document.getElementById('fallback');
      const openDirect = document.getElementById('openDirect');

      openDirect.href = WEB_APP_URL;
      // If your app doesn't need camera/mic, consider removing the allow attribute above.
      frame.src = WEB_APP_URL;

      // Hide loading when iframe reports load
      frame.addEventListener('load', () => {
        loading.classList.add('hide');
      });

      // Optional: listen for a postMessage from the embedded app to hide loader when app signals readiness.
      // (Requires the embedded app to postMessage({appReady:true}, origin))
      window.addEventListener('message', (ev) => {
        try {
          // only accept messages from script.google.com origin
          if (!ev.origin || !ev.data) return;
          if (ev.origin.indexOf('https://script.google.com') !== 0) return;
          if (ev.data && ev.data.appReady === true) {
            loading.classList.add('hide');
          }
        } catch (e) { /* ignore */ }
      });

      // Show fallback if the iframe hasn't loaded after a timeout
      const MAX_WAIT = 8000;
      const SHOW_FALLBACK_AFTER = 3500; // show fallback link earlier
      setTimeout(() => {
        if (!loading.classList.contains('hide')) fallback.classList.add('show');
      }, SHOW_FALLBACK_AFTER);

      // final fail-safe: if after MAX_WAIT still not loaded, keep fallback visible and allow user to open directly
      setTimeout(() => {
        if (!loading.classList.contains('hide')) {
          fallback.classList.add('show');
          // Optionally hide the loader visually but keep it accessible momentarily
          loading.classList.add('hide');
        }
      }, MAX_WAIT);

      // Note: iframe onerror is unreliable across browsers; using timeouts + postMessage is more robust.
    })();
  </script>
</body>
</html>
