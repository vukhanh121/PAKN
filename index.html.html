<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b315f">
  <title>Hệ thống theo dõi kiến nghị cử tri - HĐND phường Rạch Giá</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#f4f7fb;font-family:Segoe UI,Arial,sans-serif}
    body{overflow:hidden}
    .loading{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#eef5ff,#fff);z-index:2;color:#0b315f;text-align:center;padding:24px;transition:opacity .25s ease}
    .loading.hide{opacity:0;pointer-events:none}
    .spinner{width:44px;height:44px;margin:0 auto 16px;border:4px solid #d9e7f7;border-top-color:#1259c3;border-radius:50%;animation:spin .8s linear infinite}
    .loading strong{display:block;font-size:17px;margin-bottom:6px}
    .loading small{color:#63758b}
    .fallback{display:none;margin-top:18px}
    .fallback.show{display:block}
    .fallback a{display:inline-block;padding:10px 16px;border-radius:9px;background:#1259c3;color:#fff;text-decoration:none;font-weight:600}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="loading" id="loading" role="status">
    <div>
      <div class="spinner" aria-hidden="true"></div>
      <strong>Đang mở hệ thống…</strong>
      <small>Hội đồng nhân dân phường Rạch Giá</small>
      <div class="fallback" id="fallback">
        <a id="openDirect" href="#" target="_blank" rel="noopener">Mở hệ thống trực tiếp</a>
      </div>
    </div>
  </div>

  <iframe
    id="appFrame"
    title="Hệ thống theo dõi, giám sát và công khai kết quả giải quyết ý kiến, kiến nghị cử tri"
    allow="camera; microphone; clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzaV3Ts29UWnCuwLt6HQtAYr5b9jGujH-NVsr0T9JzjVN7YucT7E1RYLC4Ol3at8koISw/exec';
    const frame = document.getElementById('appFrame');
    const loading = document.getElementById('loading');
    const fallback = document.getElementById('fallback');
    const openDirect = document.getElementById('openDirect');

    openDirect.href = WEB_APP_URL;
    frame.src = WEB_APP_URL;
    frame.addEventListener('load', () => loading.classList.add('hide'));

    setTimeout(() => {
      if (!loading.classList.contains('hide')) fallback.classList.add('show');
    }, 8000);
  </script>
</body>
</html>
